name: Lint

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/lint.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/lint.yml"
      - "pyproject.toml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Ruff lint check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .
