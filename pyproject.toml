[project]
name = "spiking-rl-lab"
version = "0.1.0"
description = "Experimental framework for reinforcement learning with spiking neural network policies, supporting multiple algorithms, configurable training pipelines, and reproducible experimentation."
readme = "README.md"
authors = [
    { name = "Kirill Hitushkin", email = "khitushkink@mail.ru" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "colorlog>=6.10.1",
    "dagshub>=0.7.0",
    "flatten-dict>=0.5.0",
    "gymnasium[classic-control,mujoco]>=1.3.0",
    "hydra-core>=1.3.3",
    "mlflow>=3.14.0",
    "norse>=1.1.0",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "psutil>=7.2.2",
    "skrl>=2.1.0",
    "torch>=2.12.1",
]

[project.urls]
"Homepage" = "https://github.com/KirillHit/spiking_rl_lab"

[project.scripts]
spiking-rl-lab = "spiking_rl_lab.run:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

# -------------------
# Formatting / lint
# -------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "INP001",
  "PLC0415",
  "PLR0913",
  "ARG001",
  "ARG002",
  "COM812"
]
