# @package _global_
# Frozen baseline: REINFORCE with a feed-forward ANN on CartPole-v1.
env:
  name: gymnasium
  params:
    id: CartPole-v1
    n_envs: 16
    render: false

agent:
  name: reinforce
  params:
    policy_network:
      nodes:
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 2
    device: cuda
    policy:
      name: categorical
      params: {}
    rollouts: 64
    sequence_length: 16
    learning_rate: 1e-3
    learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    experiment:
      write_interval: 2000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: test
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  use_parallel: false
  eval_timesteps: 10000
  params:
    timesteps: 20000
    headless: true
    close_environment_at_exit: false
