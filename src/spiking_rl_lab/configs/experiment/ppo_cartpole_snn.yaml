# @package _global_
# PPO with an SNN categorical policy and a feed-forward value network on CartPole-v1.
env:
  name: gymnasium
  params:
    id: CartPole-v1
    n_envs: 16
    render: false

agent:
  name: ppo
  params:
    policy_network:
      nodes:
        - name: population_code
          params:
            neurons_per_feature: 16
            sigma: 0.3
            learnable_mu: true
            learnable_sigma: true
        - name: linear
          params:
            out_features: 256
            bias: false
        - name: lif
          params:
            k: 0.4
            v_th: 0.25
            shared_k: false
            learnable_v_th: true
        - name: linear
          params:
            out_features: 256
            bias: false
        - name: lif
          params:
            k: 0.4
            v_th: 0.25
            shared_k: false
            learnable_v_th: true
        - name: linear
          params:
            out_features: 2
            bias: false
        - name: li
          params:
            k: 0.2
            shared_k: false
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cpu
    policy:
      name: categorical
    rollouts: 64
    sequence_length: 8
    state_burn_in: 32
    learning_epochs: 4
    mini_batches: 4
    ratio_clip: 0.2
    value_clip: 0.0
    value_loss_scale: 1.0
    kl_threshold: 0.04
    discount_factor: 0.99
    gae_lambda: 0.99
    policy_learning_rate: 1e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: skrl.resources.schedulers.torch.KLAdaptiveLR
    policy_learning_rate_scheduler_kwargs:
      kl_threshold: 0.03
      kl_factor: 1.4
      lr_factor: 1.2
      min_lr: 1e-5
      max_lr: 1e-3
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 5e-4
    spike_activity_loss_scale: 0.025
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      checkpoint_interval: 100000
      write_interval: 1000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: ppo_cartpole
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  demo_fps: 50.0
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  params:
    timesteps: 20000
    headless: true
    close_environment_at_exit: false
    validation:
      episodes: 100
      min_interval: 1000
      max_interval: 2000
