# @package _global_
# PPO with an ANN Beta policy on Isaac Ant, matching the SigmaDelta training settings.
env:
  name: isaaclab
  params:
    id: Isaac-Ant-Direct
    n_envs: 2048
    device: cuda:0
    render: false

agent:
  name: ppo
  params:
    policy_network:
      nodes:
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 16
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cuda:0
    policy:
      name: beta
      params:
        action_bounds: [-1.0, 1.0]
        learnable_concentration: false
        learnable_bias: true
        b_common_init: 0.0
        b_diff_init: 0.0
    rollouts: 128
    sequence_length: 8
    state_burn_in: 16
    learning_epochs: 2
    mini_batches: 16
    ratio_clip: 0.2
    value_clip: 0.0
    value_loss_scale: 1.0
    kl_threshold: 0.04
    discount_factor: 0.99
    gae_lambda: 0.95
    policy_learning_rate: 1e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: spiking_rl_lab.agents.ppo.schedulers.KLAdaptiveLR
    policy_learning_rate_scheduler_kwargs:
      kl_threshold: 0.03
      kl_factor: 1.3
      lr_factor: 1.2
      min_lr: 1e-6
      max_lr: 0.001
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 5e-4
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      checkpoint_interval: 10000
      write_interval: 5000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: ppo_isaac_ant_ann
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  demo_fps: 20.0
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  params:
    timesteps: 100000
    headless: true
    close_environment_at_exit: false
    validation:
      episodes: 32
      min_interval: 10000
      max_interval: 25000
