# @package _global_
# PPO with an ANN Beta policy and a feed-forward value network on Ant-v5.
env:
  name: gymnasium
  params:
    id: Ant-v5
    n_envs: 16
    render: false

agent:
  name: ppo
  params:
    policy_network:
      nodes:
        - name: linear
          params:
            out_features: 128
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 128
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 16
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cpu
    policy:
      name: beta
    rollouts: 64
    sequence_length: 8
    learning_epochs: 4
    mini_batches: 4
    ratio_clip: 0.2
    value_clip: 0.0
    value_loss_scale: 1.0
    kl_threshold: 0.02
    discount_factor: 0.99
    gae_lambda: 0.99
    policy_learning_rate: 1e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: null
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 5e-4
    spike_activity_loss_scale: 0.0
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      checkpoint_interval: 100000
      write_interval: 10000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: ppo_ant_ann
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  demo_fps: 20.0
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  params:
    timesteps: 500000
    headless: true
    close_environment_at_exit: false
    validation:
      episodes: 32
      min_interval: 50000
