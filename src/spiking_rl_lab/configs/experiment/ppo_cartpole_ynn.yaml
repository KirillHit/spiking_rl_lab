# @package _global_
# PPO with one recurrent Ysskar population and a constant width penalty.
env:
  name: gymnasium
  params:
    id: CartPole-v1
    n_envs: 8
    render: false

agent:
  name: ppo
  params:
    policy_network:
      nodes:
        - name: linear
          params:
            out_features: 128
            bias: false
        - name: ysskar
          params:
            compile: true  # Compile only this node; first calls include compilation time.
            dt: 0.02
            tau: 0.03
            width: 0.03
            learnable_width: true
            asymmetry: 0.8
        - name: linear
          params:
            out_features: 2
            bias: false
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cpu
    policy:
      name: categorical
    rollouts: 128
    sequence_length: 32  # Continuous phase within each BPTT sequence.
    state_burn_in: 128  # Reconstruct state from preceding transitions.
    learning_epochs: 4
    mini_batches: 4
    ratio_clip: 0.2
    value_clip: 0.0
    value_loss_scale: 0.5
    kl_threshold: 0.03
    discount_factor: 0.99
    gae_lambda: 0.95
    policy_learning_rate: 1.5e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: null
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 0.0
    width_loss_scale: 0.001
    width_target: 0.0001
    spike_activity_loss_scale: 0.0  # Signed charge is not a binary spike count.
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      checkpoint_interval: 2048
      write_interval: 128

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: ppo_cartpole_ynn
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  demo_fps: 50.0
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  params:
    timesteps: 65536  # 524288 transitions across 8 environments.
    headless: true
    close_environment_at_exit: false
    validation:
      episodes: 20
      min_interval: 1024
      max_interval: 2048
