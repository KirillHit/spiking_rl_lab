# @package _global_
# PPO with an SNN Beta policy and a feed-forward value network on Pendulum-v1.
env:
  name: gymnasium
  params:
    id: Pendulum-v1
    n_envs: 16
    render: false

agent:
  name: ppo
  params:
    policy_network:
      nodes:
        - name: population_code
          params:
            neurons_per_feature: 16
            sigma: 0.3
        - name: linear
          params:
            out_features: 64
        - name: lif
        - name: linear
          params:
            out_features: 64
        - name: lif
        - name: linear
          params:
            out_features: 2
        - name: li
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cpu
    policy:
      name: beta
      params:
        min_shape_offset: 1e-3
    rollouts: 64
    sequence_length: 8
    state_burn_in: 32
    learning_epochs: 2
    mini_batches: 1
    ratio_clip: 0.2
    value_clip: 0.2
    value_loss_scale: 1.0
    kl_threshold: 0.0
    discount_factor: 0.99
    gae_lambda: 0.99
    policy_learning_rate: 1.5e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: null
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 5e-4
    spike_activity_loss_scale: 0.05
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      write_interval: 10000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: ppo_pendulum_snn
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  demo_fps: 30.0
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  params:
    timesteps: 600000
    headless: true
    close_environment_at_exit: false
    validation:
      episodes: 100
      min_interval: 50000
