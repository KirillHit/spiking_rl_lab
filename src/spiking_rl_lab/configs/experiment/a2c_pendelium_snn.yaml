# @package _global_
# A2C with an SNN Beta policy and a feed-forward value network on Pendulum-v1.
env:
  name: gymnasium
  params:
    id: Pendulum-v1
    n_envs: 16
    render: false

agent:
  name: a2c
  params:
    policy_network:
      nodes:
        - name: population_code
          params:
            neurons_per_feature: 16
            sigma: 0.3
        - name: linear
          params:
            out_features: 64
        - name: lif
        - name: linear
          params:
            out_features: 2
        - name: li
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cpu
    policy:
      name: beta
      params:
        min_shape_offset: 1e-3
    rollouts: 64
    sequence_length: 64
    discount_factor: 0.99
    gae_lambda: 0.95
    policy_learning_rate: 1e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: null
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 1e-3
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      write_interval: 10000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: a2c_pendelium_snn
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  use_parallel: false
  eval_timesteps: 10000
  params:
    timesteps: 1000000
    headless: true
    close_environment_at_exit: false
