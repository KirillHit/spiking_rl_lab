# @package _global_
# Fixed-width recurrent Ysskar policy on Ant-v5.
env:
  name: gymnasium
  params:
    id: Ant-v5
    n_envs: 32
    render: false

agent:
  name: ppo
  params:
    policy_network:
      nodes:
        - name: linear
          params:
            out_features: 256
            bias: false
        - name: ysskar
          params:
            compile: true
            dt: 0.05
            tau: 0.03
            learnable_tau: true
            width: 0.3
            learnable_width: false
            asymmetry: 0.8
        - name: linear
          params:
            out_features: 16
            bias: false
        - name: li_current
          params:
            dt: 0.05
            tau_i: 0.1
            learnable_tau: true
            tau_ratio: 3.0
            tau_ratio_min: 1.1
            learnable_tau_ratio: true
            compile: true
    value_network:
      nodes:
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 256
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cpu
    policy:
      name: beta
      params:
        learnable_concentration: false
        learnable_bias: true
        b_common_init: 0.0
        b_diff_init: 0.0
    rollouts: 256
    sequence_length: 16
    state_burn_in: 64
    learning_epochs: 8
    mini_batches: 4
    ratio_clip: 0.2
    value_clip: 0.0
    value_loss_scale: 1.0
    kl_threshold: 0.04
    discount_factor: 0.99
    gae_lambda: 0.95
    policy_learning_rate: 1e-3
    value_learning_rate: 1e-3
    policy_learning_rate_scheduler: skrl.resources.schedulers.torch.KLAdaptiveLR
    policy_learning_rate_scheduler_kwargs:
      kl_threshold: 0.03
      kl_factor: 1.3
      lr_factor: 1.2
      min_lr: 1e-5
      max_lr: 1e-3
    value_learning_rate_scheduler: null
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    policy_grad_norm_clip: 0.5
    value_grad_norm_clip: 0.5
    entropy_loss_scale: 5e-4
    width_loss_scale: 0.0
    width_target: 0.0001
    spike_activity_loss_scale: 0.0
    time_limit_bootstrap: true
    rewards_shaper: null
    experiment:
      checkpoint_interval: 100000
      write_interval: 5000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: ppo_ant
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  demo_fps: 20.0
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  params:
    timesteps: 2000000
    headless: true
    close_environment_at_exit: false
    validation:
      episodes: 32
      min_interval: 10000
      max_interval: 50000
