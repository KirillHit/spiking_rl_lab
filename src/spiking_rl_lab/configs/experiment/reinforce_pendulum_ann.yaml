# @package _global_
# Diagnostic REINFORCE baseline for Pendulum with an unbounded Gaussian policy.
env:
  name: gymnasium
  params:
    id: Pendulum-v1
    n_envs: 16
    render: false

agent:
  name: reinforce
  params:
    policy_network:
      nodes:
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 64
        - name: torch_activation
          params:
            activation: relu
        - name: linear
          params:
            out_features: 1
    device: cuda
    policy:
      name: gaussian
      params:
        clip_mean_actions: true
        initial_log_std: -1.0
    # Pendulum-v1 episodes last 200 steps. REINFORCE needs complete trajectories
    # because it does not bootstrap the return with a value function.
    rollouts: 200
    sequence_length: 1
    learning_rate: 1e-3
    learning_rate_scheduler: null
    entropy_loss_scale: 0.0
    observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
    experiment:
      write_interval: 10000

runner:
  mode: train
  seed: 42
  deterministic: true
  experiment_name: reinforce_pendulum_ann
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_path: null
  dagshub_repo_owner: ${oc.env:DAGSHUB_REPO_OWNER,KirillHit}
  dagshub_repo_name: ${oc.env:DAGSHUB_REPO_NAME,spiking_rl_lab}

trainer:
  use_parallel: false
  eval_timesteps: 10000
  params:
    timesteps: 1000000
    headless: true
    close_environment_at_exit: false
