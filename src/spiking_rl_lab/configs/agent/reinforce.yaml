defaults:
  - /networks@params.policy_network: reinforce_mlp
  - _self_

name: reinforce
params:
  device: cuda
  policy:
    name: categorical
    params: {}
  rollouts: 64
  sequence_length: 16
  learning_rate: 1e-3
  learning_rate_scheduler: null
  observation_preprocessor: skrl.resources.preprocessors.torch.RunningStandardScaler
  experiment:
    write_interval: 2000
