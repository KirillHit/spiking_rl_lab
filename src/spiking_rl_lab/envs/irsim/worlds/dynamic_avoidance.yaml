world:
  height: 20
  width: 20
  step_time: 0.05
  sample_time: 0.05
  offset: [0, 0]
  collision_mode: unobstructed
  control_mode: auto

robot:
  - kinematics: {name: diff}
    shape: {name: circle, radius: 0.25}
    state: [1, 10, 0]
    goal: [19, 10, 0]
    vel_min: [0, -2]
    vel_max: [1, 2]
    goal_threshold: 0.3
    color: blue
    sensors:
      - type: lidar2d
        range_min: 0
        range_max: 8
        angle_range: 3.490659
        number: 36
    plot:
      show_goal: true
      show_trajectory: true

obstacle:
  - number: 10
    distribution:
      name: random
      range_low: [2, 1, -3.141593]
      range_high: [9.5, 19, 3.141593]
      min_distance: 1.2
    kinematics: {name: omni}
    shape:
      name: polygon
      random_shape: true
      is_convex: true
      center_range: [0, 0, 0, 0]
      avg_radius_range: [0.25, 0.4]
      irregularity_range: [0.1, 0.6]
      num_vertices_range: [4, 9]
    behavior:
      name: sfm
      wander: true
      range_low: [2, 1, -3.141593]
      range_high: [9.5, 19, 3.141593]
      vmax: 0.8
      neighbor_threshold: 5.0
      force_factor_social: 5.0
      force_factor_obstacle: 8.0
      safety_radius: 0.1
    vel_min: [-0.8, -0.8]
    vel_max: [0.8, 0.8]
    goal_threshold: 0.4
    color: orange

  - number: 10
    distribution:
      name: random
      range_low: [10.5, 1, -3.141593]
      range_high: [18, 19, 3.141593]
      min_distance: 1.2
    kinematics: {name: omni}
    shape:
      name: polygon
      random_shape: true
      is_convex: true
      center_range: [0, 0, 0, 0]
      avg_radius_range: [0.25, 0.4]
      irregularity_range: [0.1, 0.6]
      num_vertices_range: [4, 9]
    behavior:
      name: rvo
      wander: true
      range_low: [10.5, 1, -3.141593]
      range_high: [18, 19, 3.141593]
      vxmax: 0.9
      vymax: 0.9
      factor: 1.5
      neighbor_threshold: 4.0
    vel_min: [-0.9, -0.9]
    vel_max: [0.9, 0.9]
    goal_threshold: 0.4
    color: green

  - number: 15
    distribution:
      name: random
      range_low: [2, 1, -3.141593]
      range_high: [18, 19, 3.141593]
      min_distance: 1.4
    shape:
      name: polygon
      random_shape: true
      is_convex: true
      center_range: [0, 0, 0, 0]
      avg_radius_range: [0.35, 0.7]
      irregularity_range: [0.1, 0.6]
      num_vertices_range: [4, 9]
    color: gray

  - number: 4
    distribution: {name: manual}
    shape:
      - {name: rectangle, length: 20, width: 0.1}
      - {name: rectangle, length: 20, width: 0.1}
      - {name: rectangle, length: 20, width: 0.1}
      - {name: rectangle, length: 20, width: 0.1}
    state:
      - [10, 0, 0]
      - [10, 20, 0]
      - [0, 10, 1.5708]
      - [20, 10, 1.5708]
    color: black
